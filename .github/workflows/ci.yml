name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_API_KEY: "ci-placeholder"
      GROQ_API_KEY: "ci-placeholder"
      GOOGLE_API_KEY: "ci-placeholder"
      OPENAI_API_KEY: "ci-placeholder"
      DATABASE_URL: "sqlite+aiosqlite:///./ci_audit.db"
      MEMORIES_DB_URL: "sqlite+aiosqlite:///./ci_memories.db"
      OLLAMA_API_KEY: "ci-placeholder"
      LANGSMITH_API_KEY: "ci-placeholder"
      JWT_SECRET: "ci-placeholder-secret"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen && uv pip install pytest-asyncio

      - name: Lint with ruff
        run: uvx ruff check src/

      - name: Check app imports
        run: uv run python -c "from api.app import app; print('App loaded OK')"
        env:
          PYTHONPATH: src

      - name: Run tests
        run: uv run pytest src/tests/ -v --ignore=src/tests/evals -x
        env:
          PYTHONPATH: src
